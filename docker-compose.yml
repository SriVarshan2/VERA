services:
  vera:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vera_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXTAUTH_SECRET=vera_super_secret_jwt_key_2026_hackathon
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - vera_db_data:/app/prisma

volumes:
  vera_db_data:
