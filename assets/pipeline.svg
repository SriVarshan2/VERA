<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <style>
      .card {
        animation: bob 4s ease-in-out infinite;
      }
      .card-1 { animation-delay: 0.0s; }
      .card-2 { animation-delay: 0.5s; }
      .card-3 { animation-delay: 1.0s; }
      .card-4 { animation-delay: 1.5s; }
      .card-5 { animation-delay: 2.0s; }

      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      .flow-line {
        stroke: #6366f1;
        stroke-width: 2.5;
        stroke-dasharray: 6 6;
        fill: none;
        animation: flow 1s linear infinite;
      }

      @keyframes flow {
        from { stroke-dashoffset: 12; }
        to { stroke-dashoffset: 0; }
      }
    </style>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#020617" />

  <g transform="translate(0, 30)">
    
    <!-- Connectors -->
    <path class="flow-line" d="M 205 70 L 265 70" marker-end="url(#arrow)" />
    <path class="flow-line" d="M 445 70 L 505 70" marker-end="url(#arrow)" />
    <path class="flow-line" d="M 685 70 L 745 70" marker-end="url(#arrow)" />
    <path class="flow-line" d="M 925 70 L 985 70" marker-end="url(#arrow)" />

    <!-- Card 1 -->
    <g class="card card-1" transform="translate(25, 0)">
      <rect x="0" y="0" width="180" height="140" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="180" height="6" fill="#38bdf8" rx="3" />
      <text x="90" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Judge Scores</text>
      <text x="90" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Raw inputs from</text>
      <text x="90" y="98" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">multiple judges</text>
    </g>

    <!-- Card 2 -->
    <g class="card card-2" transform="translate(265, 0)">
      <rect x="0" y="0" width="180" height="140" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="180" height="6" fill="#6366f1" rx="3" />
      <text x="90" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Append-only Log</text>
      <text x="90" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Immutable stream</text>
      <text x="90" y="98" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">of score events</text>
    </g>

    <!-- Card 3 -->
    <g class="card card-3" transform="translate(505, 0)">
      <rect x="0" y="0" width="180" height="140" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="180" height="6" fill="#c084fc" rx="3" />
      <text x="90" y="45" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Bias &amp; Fatigue</text>
      <text x="90" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Detection</text>
      <text x="90" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Z-score variance &amp;</text>
      <text x="90" y="113" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">flatline checks</text>
    </g>

    <!-- Card 4 -->
    <g class="card card-4" transform="translate(745, 0)">
      <rect x="0" y="0" width="180" height="140" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="180" height="6" fill="#f472b6" rx="3" />
      <text x="90" y="45" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Confidence</text>
      <text x="90" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Weighting</text>
      <text x="90" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Downweight anomalous</text>
      <text x="90" y="113" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">evaluations dynamically</text>
    </g>

    <!-- Card 5 -->
    <g class="card card-5" transform="translate(985, 0)">
      <rect x="0" y="0" width="180" height="140" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="180" height="6" fill="#2dd4bf" rx="3" />
      <text x="90" y="45" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2dd4bf" text-anchor="middle">Rank + Explain</text>
      <text x="90" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2dd4bf" text-anchor="middle">Proof</text>
      <text x="90" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Normalized rank &amp;</text>
      <text x="90" y="113" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">mathematical proof</text>
    </g>
  </g>
</svg>
