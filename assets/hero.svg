<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Animated Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="75%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" values="0%;-100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;100%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .grid-line {
        stroke: #312e81;
        stroke-width: 1.5;
        opacity: 0.3;
      }
      .perspective-grid {
        animation: grid-scroll 3s linear infinite;
      }
      @keyframes grid-scroll {
        from { transform: translateY(0px); }
        to { transform: translateY(40px); }
      }
      .cube {
        animation: float 4s ease-in-out infinite;
      }
      .cube-1 { animation-delay: 0.0s; }
      .cube-2 { animation-delay: 0.8s; }
      .cube-3 { animation-delay: 1.2s; }
      .cube-4 { animation-delay: 1.8s; }
      .cube-5 { animation-delay: 2.5s; }
      .cube-6 { animation-delay: 3.2s; }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
      .orbit-path {
        fill: none;
        stroke: rgba(99, 102, 241, 0.2);
        stroke-width: 1.5;
        stroke-dasharray: 4 8;
      }
    </style>

    <!-- Isometric Cube Symbol -->
    <g id="iso-cube">
      <!-- Top face -->
      <polygon points="0,15 25,0 50,15 25,30" opacity="0.9" />
      <!-- Left face -->
      <polygon points="0,15 25,30 25,60 0,45" opacity="0.6" />
      <!-- Right face -->
      <polygon points="25,30 50,15 50,45 25,60" opacity="0.3" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Perspective Grid (Faux 3D by drawing converging lines) -->
  <g opacity="0.5">
    <path class="grid-line" d="M -400,400 L 600,100 L 1600,400" />
    <path class="grid-line" d="M -100,400 L 600,100 L 1300,400" />
    <path class="grid-line" d="M 200,400 L 600,100 L 1000,400" />
    <path class="grid-line" d="M 450,400 L 600,100 L 750,400" />
    <!-- Horizontals -->
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="220" x2="1200" y2="220" class="grid-line" />
    <line x1="0" y1="170" x2="1200" y2="170" class="grid-line" />
    <line x1="0" y1="130" x2="1200" y2="130" class="grid-line" />
  </g>

  <!-- Tilted Orbit Ring -->
  <g transform="translate(600, 200) rotate(-10)">
    <path id="orbit-ring" class="orbit-path" d="M -450,0 A 450,90 0 1,0 450,0 A 450,90 0 1,0 -450,0" />
    
    <circle r="5" fill="#38bdf8" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite">
        <mpath href="#orbit-ring" />
      </animateMotion>
    </circle>
    
    <circle r="4" fill="#f472b6" filter="url(#glow)">
      <animateMotion dur="12s" repeatCount="indefinite" begin="2s">
        <mpath href="#orbit-ring" />
      </animateMotion>
    </circle>

    <circle r="6" fill="#818cf8" filter="url(#glow)">
      <animateMotion dur="10s" repeatCount="indefinite" begin="-4s">
        <mpath href="#orbit-ring" />
      </animateMotion>
    </circle>
  </g>

  <!-- Floating Cubes -->
  <g fill="#818cf8" transform="translate(150, 100)" class="cube cube-1 scale-75">
    <use href="#iso-cube" />
  </g>
  <g fill="#38bdf8" transform="translate(250, 280)" class="cube cube-2 scale-110">
    <use href="#iso-cube" />
  </g>
  <g fill="#c084fc" transform="translate(900, 80)" class="cube cube-3 scale-90">
    <use href="#iso-cube" />
  </g>
  <g fill="#f472b6" transform="translate(1000, 250)" class="cube cube-4 scale-125">
    <use href="#iso-cube" />
  </g>
  <g fill="#2dd4bf" transform="translate(80, 220)" class="cube cube-5 scale-100">
    <use href="#iso-cube" />
  </g>
  <g fill="#e879f9" transform="translate(1100, 150)" class="cube cube-6 scale-80">
    <use href="#iso-cube" />
  </g>

  <!-- Center Typography -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="url(#text-grad)" letter-spacing="8">
      VERA
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" letter-spacing="2">
      Verifiable Evaluation &amp; Ranking Assistant
    </text>
    
    <!-- Tagline -->
    <text x="600" y="280" font-family="monospace" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="1">
      [ Event-sourced judging • Bias detection • Explainable ranks ]
    </text>
  </g>
</svg>
